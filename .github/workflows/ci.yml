name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Vega ships a messenger, not a library: a warning in crypto or transport code
  # is a defect until someone has looked at it.
  RUSTFLAGS: -D warnings

jobs:
  # The workspace Cargo.toml is the version every artifact is named after, and
  # both tag.yml and release.yml refuse a version the other two files disagree
  # with. Checking here means drift is caught on the commit that introduced it,
  # rather than at the moment someone is trying to cut a release.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cargo.toml, package.json, tauri.conf.json and CHANGELOG.md agree
        run: |
          set -euo pipefail
          cargo_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          pkg_version="$(grep -m1 '"version"' app/package.json | cut -d'"' -f4)"
          conf_version="$(grep -m1 '"version"' app/src-tauri/tauri.conf.json | cut -d'"' -f4)"

          fail=0
          if [ "$pkg_version" != "$cargo_version" ]; then
            echo "::error file=app/package.json::package.json is $pkg_version but the workspace Cargo.toml is $cargo_version"
            fail=1
          fi
          if [ "$conf_version" != "$cargo_version" ]; then
            echo "::error file=app/src-tauri/tauri.conf.json::tauri.conf.json is $conf_version but the workspace Cargo.toml is $cargo_version"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

          # A released version needs a section to draw release notes from. A
          # version still being worked on legitimately has none yet, so this
          # only warns.
          if ! grep -q "^## \[$cargo_version\]" CHANGELOG.md; then
            echo "::warning file=CHANGELOG.md::no CHANGELOG section for $cargo_version yet"
          fi
          echo "Version $cargo_version"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential

      # No `with: toolchain` — rust-toolchain.toml pins it, which also keeps the
      # dependency cache from being invalidated every six weeks.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      # The integration tests bind loopback sockets and wait on real handshakes,
      # so they need a moment more patience than a unit test run.
      - run: cargo test --workspace
        timeout-minutes: 20

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
