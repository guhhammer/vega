name: nightly

# Everything worth knowing but not worth blocking a pull request for. Failures
# here are a morning's work, not a broken merge.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: android cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27

      # Proves the Rust half still builds for a phone. It does not prove the app
      # runs — that needs the native plugins described in
      # .documentation/android.md, which are not written yet.
      - name: Build the libraries for Android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            build --release -p vega-core -p vega-net

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links are how documentation rots without anyone
      # noticing, so they are errors rather than warnings.
      - run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  release-profile:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      # LTO and codegen-units=1 occasionally surface what a debug build hides.
      - run: cargo build --release --workspace
      - run: cargo test --release --workspace
        timeout-minutes: 30

  unused-deps:
    name: unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # A dependency nobody uses is still a dependency somebody has to trust.
      - run: cargo install cargo-udeps --locked
      - run: cargo +nightly udeps --workspace --all-targets
        continue-on-error: true
