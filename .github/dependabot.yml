version: 2

updates:
  # Cryptography and networking dependencies are the ones where a stale version
  # is a real risk, so they are checked weekly rather than monthly.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # libp2p releases its ~30 sub-crates in lockstep; separate PRs for each
      # would never merge cleanly.
      libp2p:
        patterns:
          - "libp2p*"
      crypto:
        patterns:
          - "vodozemac"
          - "*dalek*"
          - "chacha20poly1305"
          - "hkdf"
          - "sha2"
          - "blake3"

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
