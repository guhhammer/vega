[package]
name = "vega-android"
description = "Background delivery on Android: a foreground service, a multicast lock, and the battery-optimisation prompt"
# Required by `tauri-plugin`, and it insists this matches the package name: it
# is how the CLI finds the Gradle project under `android/` at build time.
links = "vega-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[build-dependencies]
# Writes the plugin's autogenerated permission files and tells the Tauri CLI
# where the Gradle project lives, which is what gets it linked into the
# generated `gen/android` build.
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }

serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true
